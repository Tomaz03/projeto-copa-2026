<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:title" content="Skywork Generated Project" />
    <meta property="og:description" content="Skywork Generated Project" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (!window.location.hash || window.location.pathname === "/reset-password") return;

        var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var hasRecoveryToken =
          hashParams.get("type") === "recovery" ||
          hashParams.has("access_token") ||
          hashParams.has("refresh_token");

        if (hasRecoveryToken) {
          window.history.replaceState(
            null,
            document.title,
            "/reset-password" + window.location.hash
          );
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
